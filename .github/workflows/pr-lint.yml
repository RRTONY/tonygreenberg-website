name: Quality Gates

on:
  push:
    branches: [main, "manus/**"]
  pull_request:
    branches: [main]

jobs:
  review-declaration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require completed implementation declarations
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          test -n "$PR_BODY"
          printf '%s\n' "$PR_BODY" | grep -Fq '[x] I reviewed existing feature and shared components before creating a new component or interaction primitive.'
          printf '%s\n' "$PR_BODY" | grep -Fq '[x] I reused an existing component, or documented why no existing semantic fit was available.'
          printf '%s\n' "$PR_BODY" | grep -Fq '[x] `pnpm quality` passes locally.'

  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run required quality gates
        env:
          TONY_CI_CONTENT_MODE: empty
        run: pnpm run quality
