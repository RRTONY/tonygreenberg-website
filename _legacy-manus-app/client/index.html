    <script>
      // SPA route change tracking for GA4 — fires on every wouter navigation
      (function() {
        var _pushState = history.pushState;
        var _replaceState = history.replaceState;
        function trackPage() {
          if (typeof gtag === 'function') {
            gtag('event', 'page_view', {
              page_path: window.location.pathname + window.location.search,
              page_title: document.title,
            });
          }
        }
        history.pushState = function() { _pushState.apply(this, arguments); trackPage(); };
        history.replaceState = function() { _replaceState.apply(this, arguments); trackPage(); };
        window.addEventListener('popstate', trackPage);
      })();
    </script>
